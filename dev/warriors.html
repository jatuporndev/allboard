<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Procedural warrior workshop</title><style>body{margin:0;background:#14211e;color:#dac9a1;font:13px system-ui}canvas{display:block;width:100vw;height:100vh}header{position:absolute;top:30px;left:40px;pointer-events:none}h1{font:38px Georgia;margin:5px 0 10px}small{letter-spacing:3px}#labels{position:absolute;bottom:35px;left:3%;right:3%;display:flex;justify-content:space-around}#labels span{text-align:center;width:14%;font:22px Georgia}#labels small{display:block;font:9px system-ui;margin-top:8px;letter-spacing:1px}</style></head><body><canvas></canvas><header><small>ORIGINAL PROCEDURAL SCULPTURES</small><h1>The living armies of Siam</h1><p>Articulated stone · cast bronze · engraved armor</p></header><div id="labels"></div><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {makePiece,WARRIORS} from '../src/scene/pieces.js';
import {surrenderPose,idlePose,attackPose,defeatPose,walkPose} from '../src/scene/poses.js';
import {studioReflections} from '../src/scene/lighting.js';
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x14211e);studioReflections(renderer,scene);const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,100);camera.position.set(0,3.2,-11);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.8,0);controls.update();scene.add(new THREE.HemisphereLight(0xf2edd8,0x302b23,.8));const key=new THREE.DirectionalLight(0xffe8ce,3.4);key.position.set(-3,7,-5);key.castShadow=true;key.shadow.bias=-.00012;key.shadow.normalBias=.012;key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-7,right:7,top:5,bottom:-5});scene.add(key);const rim=new THREE.DirectionalLight(0xc4d2dd,1.2);rim.position.set(3,4,2);scene.add(rim);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:0x192d26,roughness:.75}));floor.rotation.x=-Math.PI/2;floor.position.y=-.045;floor.receiveShadow=true;scene.add(floor);
const types=['P','S','K','M','N','R','F'],pieces=[];for(let i=0;i<types.length;i++){const p=makePiece({id:i,type:types[i],color:'white'});p.position.x=(3-i)*1.45;p.rotation.y=-.15;scene.add(p);pieces.push(p);document.querySelector('#labels').innerHTML+=`<span>${types[i]}<small>${WARRIORS[types[i]].name}</small></span>`;}
window.workshop={pieces,renderer,scene,camera,controls,surrenderPose,attackPose,defeatPose,walkPose};let t=0,last=performance.now();function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;t+=dt;pieces.forEach(p=>idlePose(p,t));renderer.render(scene,camera);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
